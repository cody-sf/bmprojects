; ElkRemote - standalone controller for the ELK-BLEDOM light bars,
; running on the 1-USB "Cheap Yellow Display" (ESP32-2432S028R, ILI9341).
;
; The TFT_eSPI pin map below is the stock CYD wiring (witnessmenow's
; DisplayConfig/User_Setup.h) passed as build flags so the library needs no
; edits. Touch (XPT2046) is on its own SPI bus and is driven directly by
; XPT2046_Touchscreen - it is NOT wired to the TFT's bus, so TFT_eSPI's own
; touch support stays off.
;
; BLE is central-only: 8 bars held connected at once needs the connection
; ceiling raised from NimBLE's default of 3 (controller max is 9).

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^2.2.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; --- BLE: central only, room for all 8 bars ---
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=9
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    ; --- TFT_eSPI: CYD (1-USB / ILI9341) pin map ---
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_RGB_ORDER=TFT_BGR
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
