; BikeRemote - standalone handlebar controller for a BMDevice (the bike),
; running on the 1-USB "Cheap Yellow Display" (ESP32-2432S028R, ILI9341).
;
; Sibling of ElkRemote: same board, same TFT_eSPI build-flag pin map, same
; separate-bus XPT2046 touch. The difference is the radio's other end - this
; one is a BLE central for the BMDevice protocol (ArduinoBLE peripheral on the
; bike), one connection, JSON status notifications back.
;
; ArduinoJson parses those status chunks; NimBLE stays central-only. The MTU
; is raised because a status chunk runs up to ~239 bytes (see the
; ble-payload-ceiling note in CLAUDE.md's orbit).

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^2.2.1
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; --- BLE: central only ---
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    ; --- TFT_eSPI: CYD (1-USB / ILI9341) pin map ---
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_RGB_ORDER=TFT_BGR
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
