; ── Local network flashing (espota) ──────────────────────────────────────────
; Push a locally-built image over WiFi instead of USB or a GitHub release. The
; device must be on WiFi (provision it in the app) and running firmware built
; with LOCAL_OTA_ENABLED=1. Target it by IP or its bm-xxxx.local name:
;
;   pio run -e hotel_sign_ota -t upload --upload-port 192.168.1.42
;   pio run -e esp32_ota      -t upload --upload-port bm-1a2b.local
;
; If you set LOCAL_OTA_PASSWORD in OTAConfig.h, add: --upload-flags --auth=<pw>
; Each *_ota env only changes how the image is uploaded; the binary is identical
; to its USB env, so `pio run -e esp32` and `-e esp32_ota` build the same thing.

[env:esp32_ota]
extends = env:esp32
upload_protocol = espota
upload_flags = --auth=cody

[env:c6_ota]
extends = env:c6
upload_protocol = espota
upload_flags = --auth=cody

[env:slut_ota]
extends = env:slut
upload_protocol = espota
upload_flags = --auth=cody

[env:hotel_sign_ota]
extends = env:hotel_sign
upload_protocol = espota
upload_flags = --auth=cody

[env:takoyaki_sign_ota]
extends = env:takoyaki_sign
upload_protocol = espota
upload_flags = --auth=cody
